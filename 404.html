<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 页面不存在</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #16181d;
    --fg-soft: #5c6270;
    --brand: #4f46e5;
    --brand-2: #06b6d4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1016; --fg: #f0f2f7; --fg-soft: #a6acbd; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .tag {
    margin: 0 0 14px;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--fg-soft);
  }
  h1 {
    margin: 0 0 16px;
    font-size: clamp(1.9rem, 6vw, 2.8rem);
    letter-spacing: -.025em;
    line-height: 1.2;
  }
  p.sub {
    margin: 0 0 32px;
    max-width: 420px;
    color: var(--fg-soft);
    line-height: 1.7;
  }
  a.btn {
    display: inline-block;
    padding: 12px 26px;
    border-radius: 999px;
    background: var(--fg);
    color: var(--bg);
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: transform .2s ease, opacity .2s ease;
  }
  a.btn:hover { transform: translateY(-2px); opacity: .92; }
</style>
</head>
<body>
  <main>
    <p class="tag">Error 404</p>
    <h1>这里什么都没有</h1>
    <p class="sub">你要找的页面可能已被移动或删除。回到首页看看吧。</p>
    <a class="btn" href="./">返回首页</a>
  </main>
</body>
</html>
